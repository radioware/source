# Radioware Source configuration.
#
# Reads f32le PCM from a UDP socket, encodes it with Opus, and streams the
# result to an output UDP socket.
#
# The values below are the built-in defaults. They can be overridden, in order
# of increasing precedence, by RADIOWARE_* environment variables and by
# command-line flags passed to radioware-source.

# Address the input UDP socket binds to.
input_bind = "[::]:8888"

# Sample rate (Hz) of the incoming f32le PCM.
input_samplerate = 48000

# Number of audio channels.
channels = 1

# Codec frame duration in milliseconds.
frame_duration = 20

# Address the output UDP socket binds to.
output_bind = "[::]:0"

# Destination the encoded audio is sent to.
output_host = "localhost:1235"

# Output sample rate (Hz).
output_samplerate = 8000

# Output Opus bitrate (bit/s).
output_bitrate = 16000
